name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # openMotor is GPLv3 and is not vendored here, so CI clones it the same
      # way scripts/setup_env.sh does, pinned to the same commit.
      - name: Clone openMotor
        run: |
          git clone https://github.com/reilleya/openMotor.git vendor/openMotor
          git -C vendor/openMotor checkout 0dfb3f1dd4f843499c7f71dc85a3dfde5dd15c6a

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # motorlib ships a Cython extension; build it in place and put it on
          # the path, exactly as the setup script does.
          (cd vendor/openMotor && python setup.py build_ext --inplace)
          echo "$GITHUB_WORKSPACE/vendor/openMotor" \
            > "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')/openmotor_vendor.pth"
          python -c "from motorlib.motor import Motor; print('openMotor ready')"

      - name: Tests
        run: python -m pytest tests/ -q

      # The claim the whole design space rests on, checked against the simulator
      # rather than taken on trust. The scripts run on whatever motor is in
      # motor/, and the repository ships no motor at all -- it is the user's,
      # not the tool's -- so CI builds the sample one first.
      - name: Verify the core-ordering assumption
        run: |
          python tests/sample_motor.py motor/sample.ric
          python scripts/verify_ordering.py
